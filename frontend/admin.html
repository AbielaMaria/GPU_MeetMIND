<!DOCTYPE html>
<!-- ============================================================
     MeetMind — Admin (role = "admin" only)
     ------------------------------------------------------------
     Deliberately simple: one screen to see / add / edit / remove
     users. Users live in the server's SQLite database (see
     backend/database.py), via the admin-only /api/users endpoints
     in backend/auth.py; changes here affect who can sign in,
     everywhere.
============================================================ -->
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — MeetMind</title>
    <meta name="color-scheme" content="light dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

    <script>
        (function () {
            try {
                var s = localStorage.getItem("meetmind-theme");
                if (s === "light" || s === "dark") {
                    document.documentElement.setAttribute("data-theme", s);
                }
            } catch (e) {}
        })();
    </script>

    <!-- Access control for this page (signed in AND role "admin") is
         enforced server-side before admin.html is served at all; see
         backend/app.py's /admin route. No client-side guard here: a
         second opinion can only disagree with the server, and when it
         did, the two redirected the browser back and forth endlessly. -->
    <script src="assets/auth-store.js?v=3"></script>

    <link rel="stylesheet" href="assets/theme.css">
    <link rel="stylesheet" href="assets/admin.css">

</head>

<body>

<div class="admin-shell">

    <!-- ---------- top bar ---------- -->
    <header class="admin-top">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
            </span>
            MeetMind <span class="admin-badge">Admin</span>
        </a>

        <span class="spacer"></span>

        <span class="admin-who" id="whoEmail">admin@example.com</span>

        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>

        <a class="btn btn-ghost" id="recorderBtn" href="/app">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
            Recorder
        </a>

        <button class="btn btn-ghost" id="logoutBtn" type="button">Log out</button>
    </header>

    <main class="admin-body">

        <!-- ---------- overview stats ---------- -->
        <section class="stats-grid" aria-label="Platform overview">

            <div class="stat-card">
                <span class="stat-icon stat-icon-accent" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span>
                <span class="stat-info">
                    <span class="stat-value" id="statTotalUsers">—</span>
                    <span class="stat-label">Total users</span>
                </span>
            </div>

            <div class="stat-card">
                <span class="stat-icon stat-icon-success" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
                </span>
                <span class="stat-info">
                    <span class="stat-value" id="statActiveUsers">—</span>
                    <span class="stat-label">Active users</span>
                </span>
            </div>

            <div class="stat-card">
                <span class="stat-icon stat-icon-violet" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
                </span>
                <span class="stat-info">
                    <span class="stat-value" id="statTotalMeetings">—</span>
                    <span class="stat-label">Meetings transcribed</span>
                </span>
            </div>

            <div class="stat-card">
                <span class="stat-icon stat-icon-warning" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.288-1.287Z"/></svg>
                </span>
                <span class="stat-info">
                    <span class="stat-value" id="statSummarized">—</span>
                    <span class="stat-label">Meetings summarized</span>
                </span>
            </div>

        </section>

        <section class="panel">

            <div class="panel-hd">
                <h2>Users</h2>
                <span class="hint" id="rowCount"></span>
            </div>

            <div class="panel-bd">

                <div class="table-tools">
                    <div class="search-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="search" id="userSearch" placeholder="Search username or email…" autocomplete="off">
                    </div>
                    <select id="roleFilter" aria-label="Filter by role">
                        <option value="">All roles</option>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                    <select id="statusFilter" aria-label="Filter by status">
                        <option value="">All statuses</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                    <span class="spacer"></span>
                    <button class="btn btn-accent" id="addUserBtn" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        Add user
                    </button>
                </div>

                <div class="table-scroll">
                    <table class="data">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Created</th>
                                <th>Status</th>
                                <th class="col-actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userRows"></tbody>
                    </table>
                </div>

            </div>

        </section>


        <!-- ---------- meetings ---------- -->
        <section class="panel">

            <div class="panel-hd">
                <h2>Meetings</h2>
                <span class="hint" id="meetingCount"></span>
            </div>

            <div class="panel-bd">

                <div class="table-tools">
                    <div class="search-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="search" id="meetingSearch" placeholder="Search meeting or user…" autocomplete="off">
                    </div>
                    <select id="meetingUserFilter" aria-label="Filter by user">
                        <option value="">All users</option>
                    </select>
                    <select id="meetingStatusFilter" aria-label="Filter by summary status">
                        <option value="">All statuses</option>
                        <option value="summarized">Summarized</option>
                        <option value="transcript">Transcript only</option>
                    </select>
                    <label class="date-field">
                        <span class="date-field-label">From</span>
                        <input type="date" id="meetingDateFrom" aria-label="From date">
                    </label>
                    <label class="date-field">
                        <span class="date-field-label">To</span>
                        <input type="date" id="meetingDateTo" aria-label="To date">
                    </label>
                    <span class="spacer"></span>
                    <button class="btn btn-ghost" id="meetingFilterReset" type="button">Reset filters</button>
                </div>

                <div class="table-scroll">
                    <table class="data">
                        <thead>
                            <tr>
                                <th>Meeting</th>
                                <th>User</th>
                                <th>Recorded</th>
                                <th>Contents</th>
                                <th class="col-actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="meetingRows"></tbody>
                    </table>
                </div>

            </div>

        </section>

    </main>

</div>


<!-- ---------- add / edit dialog ---------- -->
<dialog id="userDialog" class="user-dialog">
    <form method="dialog" id="userForm">

        <h3 id="dialogTitle">Add user</h3>

        <div class="form-alert error js-error" role="alert"></div>

        <div class="field" data-field="username">
            <label for="f_username">Username</label>
            <div class="input-wrap">
                <input type="text" id="f_username" name="username" autocomplete="off" required>
            </div>
            <div class="field-error" data-error-for="username"></div>
        </div>

        <div class="field" data-field="email">
            <label for="f_email">Email</label>
            <div class="input-wrap">
                <input type="email" id="f_email" name="email" autocomplete="off" required>
            </div>
            <div class="field-error" data-error-for="email"></div>
        </div>

        <div class="field" data-field="password">
            <label for="f_password"><span id="pwLabelText">Password</span></label>
            <div class="input-wrap">
                <input type="text" id="f_password" name="password" autocomplete="off">
            </div>
            <div class="field-error" data-error-for="password"></div>
        </div>

        <div class="dialog-row">
            <div class="field" data-field="role">
                <label for="f_role">Role</label>
                <div class="input-wrap">
                    <select id="f_role" name="role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="field" data-field="status">
                <label for="f_status">Status</label>
                <div class="input-wrap">
                    <select id="f_status" name="status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="dialog-actions">
            <button class="btn btn-ghost" type="button" id="dialogCancel">Cancel</button>
            <button class="btn btn-accent" type="submit" id="dialogSave">Save</button>
        </div>

    </form>
</dialog>


<!-- ---------- meeting transcript / summary viewer ---------- -->
<dialog id="meetingDialog" class="user-dialog meeting-dialog">
    <form method="dialog">

        <h3 id="meetingDialogTitle">Meeting</h3>
        <p class="hint" id="meetingDialogMeta"></p>

        <div class="meeting-tabs" role="tablist">
            <button class="meeting-tab is-active" type="button" data-tab="summary" role="tab">Summary</button>
            <button class="meeting-tab" type="button" data-tab="transcript" role="tab">Transcript</button>
        </div>

        <div class="meeting-pane" id="meetingSummaryPane"></div>
        <div class="meeting-pane" id="meetingTranscriptPane" hidden></div>

        <div class="dialog-actions">
            <button class="btn btn-ghost" type="button" id="meetingDialogClose">Close</button>
        </div>

    </form>
</dialog>

<script src="assets/theme.js?v=3"></script>
<script src="assets/admin.js?v=4"></script>

</body>
</html>
